<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#367db1">
  <title>Back to the Island</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Back to the Island game"></canvas>
    <div id="hud">
      <button id="pause" type="button" aria-label="Pause" hidden>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
      </button>
      <button id="mute" type="button" aria-label="Mute">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/><path class="cross" d="M15 9l6 6M21 9l-6 6" fill="none" stroke-width="2"/></svg>
      </button>
    </div>
    <div id="stick-base"></div>
    <div id="stick-knob"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
